[project]
name = "fairest-coin"
version = "0.1.0"
description = "Can you prove a coin flip is random? A quantum coin, built from scratch and tested on real IBM hardware."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oddur Sigurdsson", email = "oddurs@gmail.com" }]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
coin = "coin.cli:main"

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "coin"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT", "C4", "PL"]
ignore = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]
