[project]
name = "fairest-coin"
version = "0.1.0"
description = "Can you prove a coin flip is random? A quantum coin, built from scratch and tested on real IBM hardware."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oddur Sigurdsson", email = "oddurs@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
]

[project.scripts]
coin = "coin.cli:main"

[project.optional-dependencies]
ibm = [
    "qiskit>=2.6",
    "qiskit-ibm-runtime>=0.51",
    "qiskit-qasm3-import>=0.6",
]

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "coin"

[tool.ruff]
line-length = 100
target-version = "py313"
# Archived runs keep the exact script that produced them; they are records, not code.
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT", "C4", "PL"]
# Physics notation (θ, σ, ⟩, ×) belongs in docstrings and comments. String literals stay
# checked (RUF001), since that is where a lookalike character would change behaviour.
ignore = ["PLR2004", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# `I` is the identity matrix in every textbook; renaming it would hurt more than it helps.
"src/coin/gates.py" = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "pytest>=9.2.0",
    "qiskit>=2.6.1",
    "qiskit-ibm-runtime>=0.51",
    "qiskit-qasm3-import>=0.6.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]
figures = [
    "matplotlib>=3.11.2",
]

[tool.uv]
# Every sync carries the figures group, so CI, hooks and a fresh clone can all check the
# committed figures. It is still a group: the published wheel never depends on matplotlib.
default-groups = ["dev", "figures"]

[tool.ty.src]
exclude = ["data"]
